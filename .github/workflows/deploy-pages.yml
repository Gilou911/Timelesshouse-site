# Déploie le site statique sur GitHub Pages à chaque push sur main (ou à la demande).
# Pré-requis : Settings → Pages → Source : « GitHub Actions ».
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests unitaires
        run: npm ci && npm test
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest assets css js vendor _site/
          # Domaine personnalisé (optionnel) : décommentez et adaptez.
          # echo "ombres.timelesshouse.org" > _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
